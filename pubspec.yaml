name: character_meet
description: MBTI 기반 소개팅앱 - CharacterMeet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI 및 네비게이션
  cupertino_icons: ^1.0.2
  go_router: ^12.1.3
  
  # 상태 관리
  provider: ^6.1.1
  
  # 애니메이션
  lottie: ^2.7.0
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  
  # HTTP 통신
  http: ^1.1.0
  
  # 유틸리티
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # 애니메이션 에셋
  assets:
    - assets/animations/
    - assets/images/
  
  # 폰트
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
